aid: thatch
name: Thatch
description: >-
  Thatch is a health benefits company that helps businesses offer personalized
  health insurance through an ICHRA (Individual Coverage Health Reimbursement
  Arrangement) plus a Thatch Visa spend card. Its developer product, Thatch for
  Platforms, is a set of REST APIs and embeddable JavaScript components that let
  partners (payroll, HR, and SMB platforms) bring ICHRA benefits into their own
  applications: create employers, manage employees, run a hosted employer
  onboarding flow, track enrollments and members, model pay schedules, and pull
  monthly payroll deductions. The API is partner-gated, authenticates with a
  Bearer API key, and is documented at docs.thatch.com. Thatch is backed by a16z,
  General Catalyst, GV, Index Ventures, and Lux Capital.
